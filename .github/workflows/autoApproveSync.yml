# XNT-235: this job's own condition (actor == 'nextcloud-android-bot')
# can never be true in this fork -- that bot only opens PRs upstream -- so
# the automatic trigger below never produces a signal, it only silently
# skips. Disabled until this fork gets its own sync-approval actor; kept
# reachable via workflow_dispatch for testing.
# pull_request_target: # zizmor: ignore[dangerous-triggers]
#   branches:
#     - master
#     - main
#   types:
#     - opened
#     - reopened
#     - synchronize
#     - labeled
name: Auto approve sync
on:
  workflow_dispatch:

concurrency:
  group: sync-approve-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  auto-approve:
    name: Auto approve sync
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.pull_request.labels.*.name, 'sync') && github.actor == 'nextcloud-android-bot' }}
    steps:
      - name: Disabled on forks
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo 'Can not approve PRs from forks'
          exit 1

      - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
