# XeniaCloud CI — unsigned build verification for the xenia-rebrand fork.
# XNT-51. Build-only (no Gradle-wrapper validation, no lint, no unit tests) —
# deliberately narrower than upstream's android.yml, which also runs those.

name: Xenia CI (unsigned build)

on:
  push:
    branches: [ xenia-rebrand ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - name: Build debug APK (dev flavor, unsigned)
        run: bash ./gradlew assembleDev --stacktrace --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-dev-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
