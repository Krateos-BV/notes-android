# XNT-235: this workflow's daily cron queued against the ubuntu-latest-low
# label, which no runner here ever serves, so every scheduled run was
# cancelled roughly 24h later by the next one -- it has never completed,
# once, since it was added. Automatic scheduling is disabled until that is
# confirmed fixed; run it manually via workflow_dispatch to verify a hosted
# runner picks it up, then restore the schedule below.
# schedule:
#   - cron: '0 0 * * *'
name: 'Close stale issues'
on:
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 28
          days-before-close: 14
          days-before-pr-close: -1
          only-labels: 'bug,needs info'
          exempt-issue-labels: 'no-stale'
          stale-issue-message: >-
            This bug report did not receive an update in the last 4 weeks.
            Please take a look again and update the issue with new details,
            otherwise the issue will be automatically closed in 2 weeks. Thank you!
          exempt-all-pr-milestones: true
          labels-to-remove-when-unstale: 'needs info'
